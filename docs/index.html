<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vms2020</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh; /* use 100dvh for mobile dynamic viewport */
    }
    .video-container {
      width: 90%;
      max-width: 800px;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      max-height: 100vh; /* limit container height too */
    }
    video {
      max-width: 100%;
      max-height: 100vh; /* or 100dvh */
      width: auto;
      height: auto;
      display: block;
      outline: none;
    }
  </style>
</head>
<body>
  <div class="video-container">
    <video controls autoplay muted playsinline preload="metadata">
      <source src="https://media.githubusercontent.com/media/vms2020/vms2020.github.io/main/docs/assets/videos/screen-20230610-210257.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </div>
</body>
</html>
